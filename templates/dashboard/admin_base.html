{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="admin-body">

    <div class="admin-container">

        <aside class="admin-sidebar">

            <div class="admin-logo">
                Admin Panel
            </div>

            <a href="{% url 'admin_dashboard' %}" class="admin-link">
                Dashboard
            </a>

            <a href="{% url 'admin_vote_list' %}" class="admin-link">
                Votes
            </a>

            <a href="{% url 'manage_candidates' %}" class="admin-link">
                Candidates
            </a>

            <a href="{% url 'admin_election_list' %}" class="admin-link">
                Elections
            </a>

            <a href="{% url 'logout' %}" class="admin-link logout">
                Logout
            </a>

        </aside>

        <main class="admin-main">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>
</html>
