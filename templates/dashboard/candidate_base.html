{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
      <link rel="stylesheet" href="{% static 'css/style.css' %}">
      <title>Candidate Dashboard</title>
  </head>
  
  <body class="candidate-base-body">
      <nav class="candidate-base-navbar">
          <div class="candidate-base-logo">
              Candidate Portal
          </div>
          <div class="candidate-base-links">
              <a href="{% url 'candidate_dashboard' %}">
                  Dashboard
              </a>
              <a href="{% url 'my_applications' %}">
                  Applications
              </a>
              <a href="{% url 'candidate_votes' %}">
                  Votes
              </a>
              <a href="{% url 'logout' %}">
                  Logout
              </a>
          </div>
      </nav>
      {% if messages %}

        <div class="voter-messages">  
            {% for message in messages %}    
                <div class="voter-alert voter-alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}     
        </div>
        
      {% endif %}
  
      <main class="candidate-base-content">
          {% block content %}
          {% endblock %}
      </main>
    <script>
      setTimeout(() => {
          const messages = document.querySelectorAll(".voter-alert");
          messages.forEach(msg => msg.style.display = "none");
      }, 4000);
    </script>
  </body>
</html>
