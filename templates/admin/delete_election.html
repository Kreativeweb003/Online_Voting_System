{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<h2>Delete Election</h2>

<p>
    Are you sure you want to delete
    <strong>{{ election.title }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
</form>

<br>

<a href="{% url 'admin_election_list' %}">
    Cancel
</a>

{% endblock %}
