{% extends 'dashboard/candidate_base.html' %}

{% block content %}

<div class="candidate-application-page">

    <h2 class="candidate-application-title">
        Apply for: {{ election.title }}
    </h2>

    <form method="POST" class="candidate-application-form">

        {% csrf_token %}

        <div class="candidate-application-group">

            <label for="{{ form.position.id_for_label }}">
                Position
            </label>

            {{ form.position }}

        </div>

        <div class="candidate-application-group">

            <label for="{{ form.manifesto.id_for_label }}">
                Manifesto
            </label>

            {{ form.manifesto }}

        </div>

        <button type="submit" class="candidate-application-btn">
            Submit Application
        </button>

    </form>

</div>

{% endblock %}
