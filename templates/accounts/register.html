{% extends 'accounts/base.html' %}

{% block content %}

<div class="register-page">

    <h2 class="register-title">
        Create Account
    </h2>

    {% if messages %}
        {% for message in messages %}
            <div class="register-alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="register-form">
        {% csrf_token %}

        <div class="register-form-group">
            <label>
                First Name
            </label>
            <input type="text" name="first_name" class="register-input">
        </div>
        
        <div class="register-form-group">
            <label>
                Last Name
            </label>
            <input type="text" name="last_name" class="register-input">
        </div>
        
        <div class="register-form-group">
            <label>
                User Name
            </label>
            <input type="text" name="username" class="register-input">
        </div>


        <div class="register-form-group">
            <label>
                Email
            </label>
            <input type="email" name="email" class="register-input">
        </div>

        <div class="register-form-group">
            <label>
                Voter ID
            </label>
            <input type="text" name="voter_id" class="register-input">
        </div>

        <div class="register-form-group">
            <label>
                Role
            </label>
            <select name="role" class="register-input">
                <option value="voter">Voter</option>
                <option value="candidate">Candidate</option>
            </select>
        </div>

        <div class="register-form-group">
            <label>
                Password
            </label>
            <input type="password" name="password1" class="register-input">
        </div>

        <div class="register-form-group">
            <label>
                Confirm Password
            </label>
            <input type="password" name="password2" class="register-input">
        </div>

        <button type="submit" class="register-btn">
            Register
        </button>

    </form>

    <div class="register-login-link">
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

</div>

{% endblock %}
